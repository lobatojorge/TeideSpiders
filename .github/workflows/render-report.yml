name: CI/CD · TeideSpiders (Quarto + Shiny + renv)

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'data/processed/**'
      - 'R/**'
      - 'analysis/**'
      - 'scripts/**'
      - 'app/**'
      - 'reports/**'
      - 'config.R'
      - 'renv.lock'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. R + Quarto ──────────────────────────────────────────────────────
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'        # versión fija para reproducibilidad
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      # ── 3. CACHÉ AGRESIVA: librería de paquetes de renv ───────────────────
      # Clave: OS + hash de renv.lock  → solo reinstala si cambian dependencias
      # Path: directorio de caché global de renv (~/.local/share/renv en Linux)
      - name: Cache renv library
        uses: actions/cache@v4
        id: renv-cache
        with:
          path: |
            ~/.local/share/renv
            ${{ env.RENV_PATHS_CACHE }}
          key: renv-${{ runner.os }}-r4.4-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-${{ runner.os }}-r4.4-

      - name: Restore renv environment
        run: Rscript -e 'renv::restore()'
        env:
          RENV_PATHS_CACHE: ~/.local/share/renv

      # ── 4. Instalar dependencias del sistema para paquetes compilados ──────
      # Evita recompilación de paquetes que requieren librerías del sistema
      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      # ── 5. CACHÉ de datos procesados y objetos de análisis ─────────────────
      # Clave: hash de crudos + código R → invalida si datos o lógica cambian
      - name: Cache processed data & analysis objects
        uses: actions/cache@v4
        id: analysis-cache
        with:
          path: |
            data/processed/
            output/cache/
          key: analysis-${{ runner.os }}-${{ hashFiles('data/raw/**', 'R/**/*.R', 'config.R', 'analysis/**/*.R') }}
          restore-keys: |
            analysis-${{ runner.os }}-

      # ── 6. Ingesta de datos (solo si caché de processed/ falta) ───────────
      - name: Ingest raw data → parquet
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        run: Rscript scripts/ingest_data.R

      # ── 7. Pipeline de análisis (solo si caché falta) ─────────────────────
      - name: Run 01_taxo.R
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        run: Rscript -e "source('config.R'); source('analysis/01_taxo.R')"

      - name: Run 02_fun.R
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        run: Rscript -e "source('config.R'); source('analysis/02_fun.R')"

      - name: Run 03_filo.R
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        run: Rscript -e "source('config.R'); source('analysis/03_filo.R')"

      # ── 8. Preparar datos para app Shiny ──────────────────────────────────
      - name: Prepare Shiny app data
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        run: Rscript scripts/prepare_app_data.R

      # ── 9. Validar que la app Shiny carga sin errores ─────────────────────
      - name: Validate Shiny app loads
        run: |
          Rscript -e "
            source('config.R')
            # Simular carga de app sin arrancar servidor
            tryCatch({
              source('app/R/mod_riqueza.R')
              source('app/R/mod_nmds.R')
              source('app/R/mod_metrics.R')
              source('app/R/mod_beta.R')
              message('Shiny modules load OK')
            }, error = function(e) {
              cat('ERROR en módulos Shiny:', conditionMessage(e), '\n')
              quit(status = 1)
            })
          "

      # ── 10. Renderizar reporte Quarto ──────────────────────────────────────
      - name: Render Quarto report
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to:   html
          path: reports/diversity_report.Qmd

      # ── 11. Publicar reporte como artifact ────────────────────────────────
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name:            diversity-report-${{ github.sha }}
          path:            reports/diversity_report.html
          retention-days: 30

      # ── 12. (Opcional) Deploy a GitHub Pages ──────────────────────────────
      # Descomentar y añadir permisos `pages: write` al job para activar
      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v3
      #   if: github.ref == 'refs/heads/main'
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir:  reports
